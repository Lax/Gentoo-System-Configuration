# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O3 -pipe -fomit-frame-pointer"
COMMON_FLAGS="-march=arrowlake ${COMMON_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CFLAGS="${CFLAGS} -mabm -mshstk -mwbnoinvd"
CXXFLAGS="${CXXFLAGS} -mabm -mshstk -mwbnoinvd"

#CPU_FLAGS_X86="avx avx2 avx512f avx512vnni sse4_2 fma3"
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

# NOTE: This stage was built with the bindist USE flag enabled
USE=""
USE="threads -lto -pgo llvm clang jemalloc ${USE}"

USE="${USE} dist-kernel"
USE="${USE} lvm grub"

USE="${USE} alsa"

USE="${USE} -kde X gtk gnome systemd"
USE="${USE} -gnome-online-accounts"
USE="${USE} -qt5 -qt6"
USE="${USE} vpx screencast"
USE="${USE} ipv6"
USE="${USE} -cups"

USE="${USE} fcitx ibus"

LINGUAS='en en_US zh_CN'
L10N='en en-US zh zh-CN zh-HK zh-TW ja'

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8

USE="${USE} aqua"

RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native"

MAKEOPTS="-j24 -l25"

GENTOO_MIRRORS="https://mirrors.aliyun.com/gentoo/"
GENTOO_MIRRORS="${GENTOO_MIRRORS} https://mirrors.nju.edu.cn/gentoo-zh"

#GENTOO_MIRRORS="https://mirrors.aliyun.com/gentoo/ \
#    https://mirrors.163.com/gentoo/ \
#    https://mirror.nju.edu.cn/gentoo \
#    https://mirror.lzu.edu.cn/gentoo \
#    https://mirrors.tuna.tsinghua.edu.cn/gentoo \
#    https://mirrors.ustc.edu.cn/gentoo/ \
#    https://mirrors.zju.edu.cn/gentoo/"

#FEATURES="${FEATURES} getbinpkg"
#FEATURES="${FEATURES} binpkg-request-signature"

ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
ACCEPT_LICENSE="${ACCEPT_LICENSE} @EULA"

# ccache
FEATURES="${FEATURES} ccache"
CCACHE_SIZE="4G"
CCACHE_DIR="/var/tmp/ccache"

#PORTAGE_BINHOST=""

PORTAGE_NICENESS=10
FEATURES="parallel-fetch parallel-install compress-build-logs ${FEATURES}"
EMERGE_DEFAULT_OPTS="--jobs=8 --load-average=8 --quiet-build=y"

QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS="x86_64"

# error config
#FETCHCOMMAND="aria2c -x 10 -s 16 -k 1M -o \${DISTDIR}/\${FILE} \${URI}"
#RESUMECOMMAND="${FETCHCOMMAND}"

USE="${USE} networkmanager"

## kernel modules sign
USE="${USE} modules-compress -modules-sign"

MODULES_SIGN_KEY="/root/.kernel/kernel_key.pem"
MODULES_SIGN_CERT="/root/.kernel/kernel_key.pem"  # only required when key/cert is in different files
MODULES_SIGN_HASH="sha512"

# NVIDIA GPU CARDS
VIDEO_CARDS="nvidia proprietary"
USE="${USE} nvidia"
USE="${USE} cuda nvenc"
USE="${USE} wayland modules"
#USE="${USE} X"

AMDGPU_TARGETS=""

GRUB_PLATFORMS="efi-64"

http_proxy=http://127.0.0.1:64540
https_proxy=http://127.0.0.1:64540
ftp_proxy=http://127.0.0.1:64540
